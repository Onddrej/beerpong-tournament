<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beerpong turnaj</title>
<style>
/* ---------- Design tokens ---------- */
:root{
  --paper:#ffffff;
  --ink:#000000;
  --muted:#7a7a7a;
  --hair:#000000;
  --wash:#f2f2f2;
  --stroke:2px;
  --sans:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}

*,*::before,*::after{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}

button,input{font:inherit;color:inherit}

/* ---------- Shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 96px}

header.masthead{
  border-bottom:var(--stroke) solid var(--hair);
  padding:28px 0 18px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{
  margin:0;
  font-size:clamp(28px,6vw,46px);
  letter-spacing:-.035em;
  font-weight:800;
  text-transform:uppercase;
  line-height:.95;
}
.brand .sub{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
}
.masthead-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.saveflag{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  padding-right:6px;
  white-space:nowrap;
  transition:color .2s;
}
.saveflag.flash{color:var(--ink);font-weight:700}
.saveflag::before{content:"\25CF";margin-right:6px;font-size:8px;vertical-align:1px}

/* ---------- Tabs ---------- */
nav.tabs{
  display:flex;
  gap:0;
  border-bottom:1px solid var(--hair);
  overflow-x:auto;
  scrollbar-width:none;
  position:sticky;
  top:0;
  background:var(--paper);
  z-index:20;
}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  appearance:none;
  background:none;
  border:0;
  border-bottom:var(--stroke) solid transparent;
  margin-bottom:-1px;
  padding:16px 20px;
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  cursor:pointer;
  white-space:nowrap;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
nav.tabs button:disabled{opacity:.3;cursor:not-allowed}
nav.tabs button:disabled:hover{color:var(--muted)}
@media(max-width:430px){
  nav.tabs button{padding:15px 9px;font-size:11px;letter-spacing:.08em}
}

/* ---------- Generic bits ---------- */
.view{display:none;padding-top:34px}
.view.on{display:block}

.eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 12px;
}
h2.section{
  margin:0 0 20px;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.02em;
  text-transform:uppercase;
}

.btn{
  appearance:none;
  background:var(--paper);
  border:var(--stroke) solid var(--ink);
  color:var(--ink);
  padding:11px 18px;
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-weight:600;
  cursor:pointer;
  transition:background .1s,color .1s;
}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.28;cursor:not-allowed}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.btn.ghost{border-color:var(--muted);color:var(--muted);padding:8px 12px}
.btn.ghost:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.sm{padding:7px 12px;font-size:11px}

.note{color:var(--muted);font-size:13px;margin:14px 0 0}
.empty{
  border:1px dashed var(--muted);
  padding:44px 24px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:26px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* ---------- Teams ---------- */
.team-form{display:flex;gap:0;max-width:520px;margin-bottom:8px}
.team-form input{
  flex:1;
  border:var(--stroke) solid var(--ink);
  border-right:0;
  background:var(--paper);
  padding:12px 14px;
  outline:none;
  min-width:0;
}
.team-form input:focus{background:var(--wash)}
.team-list{list-style:none;margin:26px 0 0;padding:0;border-top:1px solid var(--hair)}
.team-list li{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 4px;
  border-bottom:1px solid var(--hair);
}
.team-list .num{
  font-family:var(--mono);
  font-size:12px;
  color:var(--muted);
  min-width:28px;
}
.team-list .name{flex:1;font-weight:600;word-break:break-word}
.team-list .grp{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  border:1px solid var(--ink);
  padding:2px 8px;
  text-transform:uppercase;
}

/* ---------- Standings table ---------- */
.pane{border:var(--stroke) solid var(--ink);padding:22px;margin-bottom:-2px}
.grid2 .pane+.pane{margin-left:-2px}
@media(max-width:820px){.grid2 .pane+.pane{margin-left:0}}
.pane-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.pane-head h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase}
.pane-head .table-tag{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}

table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  text-align:right;
  padding:0 0 8px;
  border-bottom:1px solid var(--hair);
  white-space:nowrap;
}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data td{
  padding:9px 0;
  border-bottom:1px solid #dcdcdc;
  text-align:right;
  font-family:var(--mono);
  font-size:13px;
  white-space:nowrap;
}
table.data td:first-child{font-family:var(--sans);font-weight:600;white-space:normal;word-break:break-word}
table.data td+td,table.data th+th{padding-left:12px}
table.data tr:last-child td{border-bottom:0}
table.data td.pts{font-weight:700;color:var(--ink)}
table.data td .rank{
  font-family:var(--mono);
  font-size:11px;
  color:var(--muted);
  margin-right:9px;
}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- Match rows ---------- */
.match-group{margin-top:26px}
.match-group .round-label{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  margin:20px 0 6px;
}
.match{
  width:100%;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:10px;
  background:var(--paper);
  border:1px solid var(--hair);
  border-top-width:0;
  padding:12px 14px;
  cursor:pointer;
  text-align:left;
  font:inherit;
}
.match:first-of-type{border-top-width:1px}
.match:hover{background:var(--wash)}
.match .side{display:flex;flex-direction:column;gap:2px;min-width:0}
.match .side.right{align-items:flex-end;text-align:right}
.match .tname{font-weight:600;word-break:break-word}
.match .tname.win{text-decoration:none}
.match .tname.lose{color:var(--muted)}
.match .tmeta{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.match .score{
  font-family:var(--mono);
  font-weight:700;
  font-size:16px;
  letter-spacing:.02em;
  padding:2px 10px;
  border:1px solid var(--hair);
  white-space:nowrap;
}
.match .score.pending{border-style:dashed;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:.14em}
.match .score-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.match .score.draw{border-style:double;border-width:4px;padding:1px 8px}
.match .draw-tag{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
}
.match.done{background:var(--paper)}
.match.bye{cursor:default;opacity:.55}
.match.bye:hover{background:var(--paper)}
.match .tbd{color:var(--muted);font-style:italic;font-weight:400}

.progress{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}

/* ---------- Bracket ---------- */
.bracket{display:flex;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
.round-col{
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  gap:14px;
  min-width:250px;
  flex:1;
  padding:0 14px;
  border-left:1px solid #dcdcdc;
}
.round-col:first-child{border-left:0;padding-left:0}
.round-col > .round-title{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--muted);
  padding-bottom:10px;
  border-bottom:1px solid var(--hair);
  margin-bottom:4px;
}
.bnode{
  border:1px solid var(--hair);
  background:var(--paper);
  padding:0;
  cursor:pointer;
  text-align:left;
  font:inherit;
  width:100%;
}
.bnode:hover{background:var(--wash)}
.bnode.bye{cursor:default;opacity:.5}
.bnode.bye:hover{background:var(--paper)}
.bnode.final{border-width:var(--stroke)}
.bnode .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px}
.bnode .row+.row{border-top:1px solid #dcdcdc}
.bnode .row .n{font-weight:600;min-width:0;word-break:break-word}
.bnode .row .n.lose{color:var(--muted)}
.bnode .row .c{font-family:var(--mono);font-size:13px;font-weight:700}
.bnode .row.winner{background:var(--ink);color:var(--paper)}
.bnode .row.winner .n{font-weight:700}
.bnode .cap{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  padding:5px 12px;
  border-top:1px solid #dcdcdc;
}
.champion{
  margin-top:30px;
  border:var(--stroke) solid var(--ink);
  padding:26px;
  text-align:center;
}
.champion .lbl{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--muted);
}
.champion .who{font-size:clamp(24px,5vw,38px);font-weight:800;letter-spacing:-.03em;text-transform:uppercase;margin-top:8px}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:100;
}
.overlay.on{display:flex}
.modal{
  background:var(--paper);
  border:var(--stroke) solid var(--ink);
  width:100%;
  max-width:560px;
  max-height:92vh;
  overflow-y:auto;
  padding:26px;
}
.modal h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.modal .ctx{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  margin:0 0 6px;
}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:24px 0 6px}
.sides .col{border:1px solid var(--hair);padding:18px 16px}
.sides .col+.col{border-left:0}
@media(max-width:540px){
  .sides{grid-template-columns:1fr}
  .sides .col+.col{border-left:1px solid var(--hair);border-top:0}
}
.sides .col h4{
  margin:0 0 16px;
  font-size:15px;
  font-weight:700;
  word-break:break-word;
  min-height:2.9em;
  display:flex;
  align-items:flex-start;
}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field label{
  display:block;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:7px;
}
.stepper{display:flex;align-items:stretch}
.stepper button{
  width:40px;
  border:1px solid var(--ink);
  background:var(--paper);
  cursor:pointer;
  font-family:var(--mono);
  font-size:17px;
  line-height:1;
  padding:0;
}
.stepper button:hover{background:var(--ink);color:var(--paper)}
.stepper input{
  flex:1;
  min-width:0;
  border:1px solid var(--ink);
  border-left:0;
  border-right:0;
  background:var(--paper);
  text-align:center;
  font-family:var(--mono);
  font-size:19px;
  font-weight:700;
  padding:10px 4px;
  outline:none;
  -moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{background:var(--wash)}
.modal-msg{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin:16px 0 0;
  min-height:1.3em;
  font-weight:700;
}
.modal-msg.hint{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:12px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.modal-actions .spacer{flex:1}

/* ---------- Results / export ---------- */
.export-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.log{width:100%;border-collapse:collapse;font-size:13px}
.log th{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
  text-align:left;
  padding:0 12px 8px 0;
  border-bottom:1px solid var(--hair);
  white-space:nowrap;
}
.log td{padding:10px 12px 10px 0;border-bottom:1px solid #dcdcdc;vertical-align:top}
.log td.n{font-family:var(--mono);white-space:nowrap}
.log td.phase{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.log td.w{font-weight:700}

/* ---------- Podium ---------- */
.podium-wrap{
  position:relative;
  overflow:hidden;
  border:var(--stroke) solid var(--ink);
  padding:34px 20px 0;
  margin-bottom:34px;
}
.podium-head{text-align:center;margin-bottom:30px}
.podium-head .lbl{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--muted);
}
.podium-head .who{
  font-size:clamp(26px,6vw,46px);
  font-weight:800;
  letter-spacing:-.035em;
  text-transform:uppercase;
  line-height:1.05;
  margin-top:6px;
  word-break:break-word;
}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;position:relative;z-index:2}
.place{flex:1;max-width:210px;min-width:0;display:flex;flex-direction:column;align-items:center}
.place .plate{text-align:center;margin-bottom:10px;width:100%}
.place .pname{
  display:block;
  font-weight:700;
  font-size:15px;
  line-height:1.25;
  word-break:break-word;
}
.place .pmeta{
  display:block;
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:4px;
}
.place .block{
  width:100%;
  height:var(--h);
  border:var(--stroke) solid var(--ink);
  border-bottom:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.place .pnum{font-family:var(--mono);font-size:38px;font-weight:700;line-height:1}
.p1{--h:150px}
.p2{--h:104px}
.p3{--h:74px}
.p1 .block{background:var(--ink);color:var(--paper)}
.p1 .pname{font-size:17px}

/* rise + fade, staggered: bronze, silver, gold */
.podium-wrap.celebrate .block{animation:podium-rise .75s cubic-bezier(.16,.9,.3,1.05) var(--d) both}
.podium-wrap.celebrate .plate{animation:podium-fade .5s ease calc(var(--d) + .45s) both}
.podium-wrap.celebrate .podium-head .who{animation:podium-pop .6s cubic-bezier(.16,1.1,.3,1.1) 1.15s both}
.podium-wrap.celebrate .podium-head .lbl{animation:podium-fade .5s ease 1s both}

@keyframes podium-rise{from{height:0}to{height:var(--h)}}
@keyframes podium-fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes podium-pop{
  0%{opacity:0;transform:scale(.86)}
  60%{opacity:1;transform:scale(1.04)}
  100%{opacity:1;transform:scale(1)}
}

.confetti{position:absolute;inset:0;pointer-events:none;z-index:1;display:none}
.podium-wrap.celebrate .confetti{display:block}
.confetti i{
  position:absolute;
  top:-24px;
  left:var(--cx);
  width:5px;
  height:13px;
  background:var(--ink);
  opacity:0;
  animation:confetti-fall 2.4s linear var(--cd) both;
}
.confetti i:nth-child(3n){width:9px;height:3px}
.confetti i:nth-child(4n){background:none;border:1.5px solid var(--ink);height:9px;width:9px;border-radius:50%}
@keyframes confetti-fall{
  0%{opacity:0;transform:translateY(0) rotate(0)}
  10%{opacity:.85}
  100%{opacity:0;transform:translateY(var(--cy)) rotate(var(--cr))}
}

.podium-actions{display:flex;justify-content:center;padding:26px 0 22px;position:relative;z-index:2}

@media(prefers-reduced-motion:reduce){
  .podium-wrap.celebrate .block,
  .podium-wrap.celebrate .plate,
  .podium-wrap.celebrate .podium-head .who,
  .podium-wrap.celebrate .podium-head .lbl{animation:none}
  .podium-wrap.celebrate .confetti{display:none}
}

table.data td.rank-medal{
  font-family:var(--mono);
  font-weight:700;
}
table.data tr.top1 td{background:var(--wash);font-weight:700}

.preview-box{border:1px solid var(--hair);padding:20px;margin-top:26px;background:var(--wash)}
.preview-box pre{
  margin:0;
  font-family:var(--mono);
  font-size:12px;
  line-height:1.5;
  white-space:pre;
  overflow-x:auto;
  max-height:340px;
  overflow-y:auto;
}

hr.rule{border:0;border-top:var(--stroke) solid var(--ink);margin:44px 0 28px}

/* ---------- Print ---------- */
@media print{
  @page{margin:14mm}
  body{font-size:11pt}
  nav.tabs,.masthead-actions,.toolbar,.export-row,.btn,.overlay{display:none !important}
  .view{display:block !important;padding-top:0;page-break-before:always}
  .view:first-of-type{page-break-before:auto}
  .match,.bnode,.pane{break-inside:avoid}
  .bracket{overflow:visible}
  .wrap{padding:0;max-width:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="brand">
      <h1>Beerpong</h1>
      <span class="sub">Turnaj &middot; 2 stoly</span>
    </div>
    <div class="masthead-actions">
      <span class="saveflag" id="save-flag"></span>
      <button class="btn ghost sm" id="btn-print">Tlač / PDF</button>
      <button class="btn ghost sm" id="btn-reset">Nový turnaj</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="teams" aria-selected="true">Tímy</button>
    <button role="tab" data-tab="groups" aria-selected="false">Skupiny</button>
    <button role="tab" data-tab="bracket" aria-selected="false">Pavúk</button>
    <button role="tab" data-tab="results" aria-selected="false">Výsledky</button>
  </nav>

  <!-- ============ TÍMY ============ -->
  <section class="view on" id="view-teams">
    <p class="eyebrow">Krok 1</p>
    <h2 class="section">Prihlásené tímy</h2>

    <form class="team-form" id="team-form" autocomplete="off">

<script>
"use strict";

/* =========================================================================
   STAV
   state.teams        [{id, name, group: 'A'|'B'|null}]
   state.groupMatches [match]  — round robin v rámci skupiny
   state.bracket      {size, rounds: [[match]], third: match|null} | null
   match              {id, stage, group?, round, a, b, cupsA, cupsB, blowsA, blowsB, done}
                      a/b sú teamId | null (null v pavúku = voľný žreb / ešte neznámy)
   ========================================================================= */

const STORAGE_KEY = "beerpong-turnaj-v1";

const restoredState = loadState();
let state = restoredState || emptyState();
let activeTab = "teams";
let openMatchId = null;

function emptyState(){
  return { teams: [], drawn: false, groupMatches: [], bracket: null };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.teams)) return null;
    return parsed;
  }catch(e){ return null; }
}

let saveFlagTimer = null;

/**
 * Persist the whole tournament after every change and confirm it in the header.
 * Reopening the file restores teams, schedule and results automatically.
 */
function save(){
  const flag = document.getElementById("save-flag");
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if(flag){
      const d = new Date();
      const p = n => String(n).padStart(2, "0");
      flag.textContent = "Uložené " + p(d.getHours()) + ":" + p(d.getMinutes());
      flag.classList.add("flash");
      clearTimeout(saveFlagTimer);
      saveFlagTimer = setTimeout(() => flag.classList.remove("flash"), 900);
    }
  }catch(e){
    if(flag){
      flag.textContent = "Ukladanie zlyhalo — exportuj JSON";
      flag.classList.add("flash");
    }
  }
}

/** Header note shown right after opening the file. */
function showRestoredFlag(restored){
  const flag = document.getElementById("save-flag");
  if(!flag) return;
  flag.textContent = restored
    ? "Načítaný uložený turnaj"
    : "Automatické ukladanie zapnuté";
}

/* =========================================================================
   POMOCNÉ FUNKCIE
   ========================================================================= */

let idSeq = 0;
/** Generate a short unique id. */
function uid(prefix){
  idSeq += 1;
  return prefix + "-" + Date.now().toString(36) + "-" + idSeq.toString(36);
}

/** Fisher-Yates shuffle, returns a new array. */
function shuffle(list){
  const arr = list.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function teamById(id){
  return state.teams.find(t => t.id === id) || null;
}

function teamName(id){
  const t = teamById(id);
  return t ? t.name : null;
}

/**
 * Slovak plural form: 1 -> one, 2-4 -> few, 0 and 5+ -> many.
 * plural(3, "tím", "tímy", "tímov") -> "3 tímy"
 */
function plural(n, one, few, many){
  const word = n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
  return n + " " + word;
}

function esc(str){
  return String(str).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

/** All matches across both phases, in playing order. */
function allMatches(){
  const list = state.groupMatches.slice();
  if(state.bracket){
    state.bracket.rounds.forEach(r => list.push(...r));
    if(state.bracket.third) list.push(state.bracket.third);
  }
  return list;
}

function findMatch(id){
  return allMatches().find(m => m.id === id) || null;
}

/** A drawn match — allowed in the group phase only. */
function isDraw(m){
  return !!m.done && m.cupsA === m.cupsB;
}

/**
 * Winner of a match: the recorded result, or the lone team of a walkover.
 * Returns null for a draw and for anything not yet decided.
 */
function winnerOf(m){
  if(m.done) return isDraw(m) ? null : (m.cupsA > m.cupsB ? m.a : m.b);
  if(m.bye) return m.a || m.b;
  return null;
}

function loserOf(m){
  if(!m.done || isDraw(m)) return null;
  return m.cupsA > m.cupsB ? m.b : m.a;
}

/**
 * True only for a genuine walkover — a first-round slot left empty because
 * the team count is not a power of two. A later-round match that is merely
 * waiting for the other half of the bracket is NOT a bye.
 */
function isBye(m){
  return !!m.bye;
}

/** A match can be recorded only once both opponents are known. */
function isPlayable(m){
  return !!m.a && !!m.b && !m.bye;
}

function clearResult(m){
  m.cupsA = null; m.cupsB = null;
  m.blowsA = 0; m.blowsB = 0;
  m.done = false;
}

function newMatch(fields){
  return Object.assign({
    id: uid("m"), stage: "group", round: 0,
    a: null, b: null,
    cupsA: null, cupsB: null, blowsA: 0, blowsB: 0,
    done: false, bye: false
  }, fields);
}

/* =========================================================================
   SKUPINY — losovanie a rozpis
   ========================================================================= */

/**
 * Round-robin schedule (circle method). Returns an array of rounds,
 * each round is an array of [teamId, teamId] pairs playable in parallel.
 */
function roundRobin(ids){
  const arr = ids.slice();
  if(arr.length % 2 === 1) arr.push(null);      // odd count -> one team rests each round
  const n = arr.length;
  const rounds = [];
  for(let r = 0; r < n - 1; r++){
    const pairs = [];
    for(let i = 0; i < n / 2; i++){
      const a = arr[i], b = arr[n - 1 - i];
      if(a && b) pairs.push(r % 2 === 0 ? [a, b] : [b, a]);
    }
    rounds.push(pairs);
    arr.splice(1, 0, arr.pop());                // rotate, keeping the first entry fixed
  }
  return rounds;
}

/** Randomly split all teams into groups A and B, then build both schedules. */
function drawGroups(){
  const order = shuffle(state.teams.map(t => t.id));
  const half = Math.ceil(order.length / 2);
  order.forEach((id, i) => {
    const t = teamById(id);
    if(t) t.group = i < half ? "A" : "B";
  });

  state.groupMatches = [];
  ["A", "B"].forEach(g => {
    const ids = state.teams.filter(t => t.group === g).map(t => t.id);
    roundRobin(ids).forEach((pairs, roundIdx) => {
      pairs.forEach(([a, b]) => {
        state.groupMatches.push(newMatch({ stage:"group", group:g, round:roundIdx, a, b }));
      });
    });
  });

  state.drawn = true;
  state.bracket = null;
}

/* =========================================================================
   TABUĽKA SKUPINY
   ========================================================================= */

/** Points awarded in the group phase: win 3, draw 1, loss 0. */
const POINTS_WIN = 3;
const POINTS_DRAW = 1;

/**
 * Standings for one group, sorted by: points, cup difference,
 * head-to-head result, cups scored, then name.
 */
function standings(group){
  const rows = state.teams
    .filter(t => t.group === group)
    .map(t => ({
      id: t.id, name: t.name,
      played:0, wins:0, draws:0, losses:0,
      cupsFor:0, cupsAgainst:0,
      blowsFor:0, blowsAgainst:0
    }));

  const byId = {};
  rows.forEach(r => { byId[r.id] = r; });

  state.groupMatches.forEach(m => {
    if(m.group !== group || !m.done) return;
    const A = byId[m.a], B = byId[m.b];
    if(!A || !B) return;
    A.played++; B.played++;
    A.cupsFor += m.cupsA; A.cupsAgainst += m.cupsB;
    B.cupsFor += m.cupsB; B.cupsAgainst += m.cupsA;
    A.blowsFor += m.blowsA; A.blowsAgainst += m.blowsB;
    B.blowsFor += m.blowsB; B.blowsAgainst += m.blowsA;
    if(isDraw(m)){ A.draws++; B.draws++; }
    else if(m.cupsA > m.cupsB){ A.wins++; B.losses++; }
    else { B.wins++; A.losses++; }
  });

  rows.forEach(r => {
    r.diff = r.cupsFor - r.cupsAgainst;
    r.points = r.wins * POINTS_WIN + r.draws * POINTS_DRAW;
  });

  rows.sort((x, y) => {
    if(y.points !== x.points) return y.points - x.points;
    if(y.diff !== x.diff) return y.diff - x.diff;
    const h2h = headToHead(x.id, y.id);
    if(h2h !== 0) return h2h;
    if(y.cupsFor !== x.cupsFor) return y.cupsFor - x.cupsFor;
    return x.name.localeCompare(y.name, "sk");
  });

  return rows;
}

/** -1 if x beat y, 1 if y beat x, 0 if undecided. */
function headToHead(xId, yId){
  const m = state.groupMatches.find(m =>
    m.done && ((m.a === xId && m.b === yId) || (m.a === yId && m.b === xId))
  );
  if(!m) return 0;
  const winner = winnerOf(m);
  if(winner === xId) return -1;
  if(winner === yId) return 1;
  return 0;
}

function groupProgress(){
  const total = state.groupMatches.length;
  const done = state.groupMatches.filter(m => m.done).length;
  return { total, done, complete: total > 0 && done === total };
}

/* =========================================================================
   PAVÚK
   ========================================================================= */

/** Standard bracket seed order, e.g. size 8 -> [1,8,4,5,2,7,3,6]. */
function seedOrder(size){
  let order = [1];
  while(order.length < size){
    const n = order.length * 2;
    const next = [];
    order.forEach(s => { next.push(s, n + 1 - s); });
    order = next;
  }
  return order;
}

/**
 * Build the knockout bracket. Every team advances; the group phase only
 * decides seeding. Seeds alternate between groups (A1, B1, A2, B2, ...)
 * so teams from the same group meet as late as possible. When the team
 * count is not a power of two, the top seeds get a walkover.
 */
function buildBracket(){
  const a = standings("A");
  const b = standings("B");
  const seeds = [];
  for(let i = 0; i < Math.max(a.length, b.length); i++){
    if(a[i]) seeds.push(a[i].id);
    if(b[i]) seeds.push(b[i].id);
  }

  const n = seeds.length;
  if(n < 2) return;

  let size = 2;
  while(size < n) size *= 2;

  const order = seedOrder(size);
  const first = [];
  for(let i = 0; i < size; i += 2){
    const s1 = order[i], s2 = order[i + 1];
    const a = seeds[s1 - 1] || null;
    const b = seeds[s2 - 1] || null;
    first.push(newMatch({
      stage:"bracket", round:0, idx:first.length,
      a, b,
      bye: (!!a && !b) || (!a && !!b)   // seed without an opponent -> walkover
    }));
  }

  const rounds = [first];
  let count = first.length;
  let r = 1;
  while(count > 1){
    count = count / 2;
    const rnd = [];
    for(let i = 0; i < count; i++){
      rnd.push(newMatch({ stage:"bracket", round:r, idx:i }));
    }
    rounds.push(rnd);
    r++;
  }

  const third = rounds.length >= 2
    ? newMatch({ stage:"bracket", round:"third", idx:0 })
    : null;

  state.bracket = { size, rounds, third, seeds };
  propagate();
}

/**
 * Recompute who sits in every bracket slot from round 1 upwards.
 * If a slot changes, the result recorded there is discarded.
 */
function propagate(){
  const br = state.bracket;
  if(!br) return;

  // Walk forwards one round at a time. Round r is already final when we read
  // it, so a cleared result cascades into every later round.
  for(let r = 0; r < br.rounds.length - 1; r++){
    const next = br.rounds[r + 1].map(() => ({ a:null, b:null }));
    br.rounds[r].forEach((m, i) => {
      next[Math.floor(i / 2)][i % 2 === 0 ? "a" : "b"] = winnerOf(m);
    });
    br.rounds[r + 1].forEach((m, i) => {
      if(m.a !== next[i].a || m.b !== next[i].b) clearResult(m);
      m.a = next[i].a;
      m.b = next[i].b;
    });
  }

  if(br.third && br.rounds.length >= 2){
    const semis = br.rounds[br.rounds.length - 2];
    const l1 = semis[0] ? loserOf(semis[0]) : null;
    const l2 = semis[1] ? loserOf(semis[1]) : null;
    if(br.third.a !== l1 || br.third.b !== l2) clearResult(br.third);
    br.third.a = l1;
    br.third.b = l2;
  }
}

function roundTitle(r, total){
  const fromEnd = total - 1 - r;
  if(fromEnd === 0) return "Finále";
  if(fromEnd === 1) return "Semifinále";
  if(fromEnd === 2) return "Štvrťfinále";
  if(fromEnd === 3) return "Osemfinále";
  return (r + 1) + ". kolo";
}

function champion(){
  const br = state.bracket;
  if(!br) return null;
  const finalMatch = br.rounds[br.rounds.length - 1][0];
  return finalMatch && finalMatch.done ? winnerOf(finalMatch) : null;
}

/**
 * Final classification of every team, available once the final is recorded.
 * Teams are ranked by how far they got in the bracket; the third-place match
 * separates the two semi-final losers, and group points break any remaining
 * tie inside the same band. Pure read-only — nothing is written to state.
 */
function finalRanking(){
  const br = state.bracket;
  const champ = champion();
  if(!br || !champ) return [];

  const stats = {};
  overallStats().forEach(r => { stats[r.id] = r; });

  // Every team except the champion loses exactly one bracket match.
  const exit = {};
  br.rounds.forEach((rnd, r) => rnd.forEach(m => {
    const l = loserOf(m);
    if(l) exit[l] = r;
  }));
  exit[champ] = br.rounds.length;

  const third = br.third;
  const thirdWinner = third && third.done ? winnerOf(third) : null;
  const thirdLoser = third && third.done ? loserOf(third) : null;

  const rows = state.teams.map(t => ({
    id: t.id,
    name: t.name,
    group: t.group,
    exit: exit[t.id] != null ? exit[t.id] : -1,
    s: stats[t.id]
  }));

  rows.sort((x, y) => {
    if(y.exit !== x.exit) return y.exit - x.exit;
    if(thirdWinner){
      if(x.id === thirdWinner && y.id === thirdLoser) return -1;
      if(y.id === thirdWinner && x.id === thirdLoser) return 1;
    }
    return y.s.points - x.s.points
      || y.s.diff - x.s.diff
      || y.s.cupsFor - x.s.cupsFor
      || x.name.localeCompare(y.name, "sk");
  });

  rows.forEach((r, i) => {
    r.rank = i + 1;
    r.exitLabel = r.exit === br.rounds.length
      ? "Víťaz"
      : (r.exit < 0 ? "—" : roundTitle(r.exit, br.rounds.length));
  });
  return rows;
}

/** Human label used in the log and CSV export. */
function matchLabel(m){
  if(m.stage === "group") return "Skupina " + m.group + " · " + (m.round + 1) + ". kolo";
  if(m.round === "third") return "O 3. miesto";
  return roundTitle(m.round, state.bracket.rounds.length);
}

/** Which of the two tables the match is played on. */
function matchTable(m){
  if(m.stage === "group") return m.group === "A" ? 1 : 2;
  if(m.round === "third") return 2;
  if(state.bracket.rounds[m.round].length === 1) return 1;
  return (m.idx % 2) + 1;
}

/* =========================================================================
   RENDER
   ========================================================================= */

function render(){
  renderTabs();
  renderTeams();
  renderGroups();
  renderBracket();
  renderResults();
}

function renderTabs(){
  const prog = groupProgress();
  document.querySelectorAll("nav.tabs button").forEach(btn => {
    const tab = btn.dataset.tab;
    btn.setAttribute("aria-selected", tab === activeTab ? "true" : "false");
    if(tab === "groups") btn.disabled = !state.drawn;
    if(tab === "bracket") btn.disabled = !state.bracket;
    if(tab === "results") btn.disabled = !state.drawn;
  });
  document.querySelectorAll(".view").forEach(v => {
    v.classList.toggle("on", v.id === "view-" + activeTab);
  });
  void prog;
}

function setTab(tab){
  activeTab = tab;
  renderTabs();
  window.scrollTo({ top:0, behavior:"smooth" });
}

/* ---------- Tímy ---------- */

function renderTeams(){
  const list = document.getElementById("team-list");
  const hint = document.getElementById("teams-hint");
  const drawBtn = document.getElementById("btn-draw");

  if(state.teams.length === 0){
    list.innerHTML = '<li style="border:0;padding:0;display:block"><div class="empty">Zatiaľ žiadne tímy. Napíš názov a stlač Pridať.</div></li>';
  }else{
    list.innerHTML = state.teams.map((t, i) => `
      <li>
        <span class="num">${String(i + 1).padStart(2, "0")}</span>
        <span class="name">${esc(t.name)}</span>
        ${t.group ? `<span class="grp">Skupina ${t.group}</span>` : ""}
        <button class="btn ghost sm" data-remove="${t.id}">Zmazať</button>
      </li>
    `).join("");
  }

  const n = state.teams.length;
  drawBtn.disabled = n < 4;
  drawBtn.textContent = state.drawn ? "Rozlosovať znova" : "Rozlosovať do skupín";

  if(n < 4){
    hint.textContent = `Pridaj aspoň 4 tímy — po dva do každej skupiny. Zatiaľ ich máš ${n}.`;
  }else{
    const half = Math.ceil(n / 2);
    hint.textContent = `${plural(n, "tím", "tímy", "tímov")} → skupina A (stôl 1): ${half}, skupina B (stôl 2): ${n - half}. `
      + (state.drawn ? "Nové losovanie vymaže všetky výsledky." : "Losovanie je náhodné.");
  }
}

/* ---------- Skupiny ---------- */

function renderGroups(){
  const box = document.getElementById("groups-body");
  if(!state.drawn){
    box.innerHTML = '<div class="empty">Najprv pridaj tímy a rozlosuj skupiny na karte Tímy.</div>';
    return;
  }

  const prog = groupProgress();
  const html = [];

  html.push(`
    <div class="toolbar">
      <span class="progress">Odohrané ${prog.done} / ${plural(prog.total, "zápas", "zápasy", "zápasov")}</span>
      <span style="flex:1"></span>
      <button class="btn ${prog.complete ? "solid" : ""}" id="btn-bracket">
        ${state.bracket ? "Pregenerovať pavúk" : "Vygenerovať pavúk"}
      </button>
    </div>
    <div class="grid2">
      ${groupPane("A", 1)}
      ${groupPane("B", 2)}
    </div>
    <hr class="rule">
    <div class="grid2">
      ${groupSchedule("A", 1)}
      ${groupSchedule("B", 2)}
    </div>
  `);

  box.innerHTML = html.join("");

  const bBtn = document.getElementById("btn-bracket");
  if(bBtn) bBtn.onclick = onBuildBracket;
  wireMatchButtons(box);
}

function groupPane(g, table){
  const rows = standings(g);
  if(rows.length === 0){
    return `<div class="pane"><div class="empty">Skupina ${g} je prázdna.</div></div>`;
  }
  return `
    <div class="pane">
      <div class="pane-head">
        <h3>Skupina ${g}</h3>
        <span class="table-tag">Stôl ${table}</span>
      </div>

        <table class="data">
          <thead>
            <tr>
              <th>Tím</th><th>Z</th><th>V</th><th>R</th><th>P</th>
              <th>Poháre</th><th>+/&minus;</th><th>Vyfuk.</th><th>B</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r, i) => `
              <tr>
                <td><span class="rank">${i + 1}</span>${esc(r.name)}</td>

                <td>${r.wins}</td>

              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function groupSchedule(g, table){
  const matches = state.groupMatches.filter(m => m.group === g);
  if(matches.length === 0) return "<div></div>";

  const rounds = {};
  matches.forEach(m => { (rounds[m.round] = rounds[m.round] || []).push(m); });

  const body = Object.keys(rounds)
    .sort((x, y) => Number(x) - Number(y))
    .map(r => `
      <p class="round-label">${Number(r) + 1}. kolo</p>
      ${rounds[r].map(matchRow).join("")}
    `).join("");

  return `
    <div class="pane">
      <div class="pane-head">
        <h3>Rozpis ${g}</h3>
        <span class="table-tag">Stôl ${table}</span>
      </div>
      ${body}
    </div>
  `;
}

function matchRow(m){
  const nameA = teamName(m.a);
  const nameB = teamName(m.b);
  const bye = isBye(m);
  const w = winnerOf(m);

  const draw = isDraw(m);

  const label = (id, name) => {
    if(!name) return '<span class="tname tbd">— čaká sa —</span>';
    const cls = m.done && !draw ? (w === id ? "win" : "lose") : "";
    return `<span class="tname ${cls}">${esc(name)}</span>`;
  };

  const meta = (blows) => m.done
    ? `<span class="tmeta">${blows} vyfuk.</span>`
    : "";

  const inner = m.done
    ? `<span class="score ${draw ? "draw" : ""}">${m.cupsA} : ${m.cupsB}</span>`
      + (draw ? '<span class="draw-tag">Remíza</span>' : "")
    : bye
      ? '<span class="score pending">voľný žreb</span>'
      : '<span class="score pending">zapísať</span>';
  const score = `<span class="score-cell">${inner}</span>`;

  return `
    <button class="match ${m.done ? "done" : ""} ${bye ? "bye" : ""}" data-match="${m.id}" ${bye ? "disabled" : ""}>
      <span class="side">${label(m.a, nameA)}${meta(m.blowsA)}</span>
      ${score}
      <span class="side right">${label(m.b, nameB)}${meta(m.blowsB)}</span>
    </button>
  `;
}

function renderBracket(){

    return;

  const br = state.bracket;

  box.innerHTML = `

      <span class="progress">${br.size}-tímový pavúk · ${plural(state.teams.length, "tím", "tímy", "tímov")} · ${plural(br.size - state.teams.length, "voľný žreb", "voľné žreby", "voľných žrebov")}</span>

function bracketNode(m, isFinal){
  const bye = isBye(m);
  const ready = isPlayable(m);
  const w = winnerOf(m);

  const row = (id, cups, isWinner) => {
    const name = teamName(id);
    return `
      <span class="row ${m.done && isWinner ? "winner" : ""}">
        <span class="n ${m.done && !isWinner ? "lose" : ""}">${name ? esc(name) : '<span class="tbd">—</span>'}</span>
        <span class="c">${m.done ? cups : ""}</span>
      </span>
    `;
  };

  const cap = m.done
    ? `${m.blowsA} : ${m.blowsB} vyfuknutí`
    : bye ? "voľný žreb → postup"
    : !ready ? "čaká na predošlé kolo"
    : "stôl " + matchTable(m) + " · zapísať výsledok";

  return `
    <button class="bnode ${isFinal ? "final" : ""} ${ready ? "" : "bye"}"
            data-match="${m.id}" ${ready ? "" : "disabled"}>
      ${row(m.a, m.cupsA, w === m.a)}
      ${row(m.b, m.cupsB, w === m.b)}
      <span class="cap">${cap}</span>
    </button>
  `;
}

/** Aggregate per-team stats across both phases. */
function overallStats(){
  const rows = state.teams.map(t => ({
    id:t.id, name:t.name, group:t.group,
    played:0, wins:0, draws:0, losses:0,
    cupsFor:0, cupsAgainst:0, blowsFor:0, blowsAgainst:0
  }));
  const byId = {};
  rows.forEach(r => { byId[r.id] = r; });

  allMatches().forEach(m => {
    if(!m.done) return;
    const A = byId[m.a], B = byId[m.b];
    if(!A || !B) return;
    A.played++; B.played++;
    A.cupsFor += m.cupsA; A.cupsAgainst += m.cupsB;
    B.cupsFor += m.cupsB; B.cupsAgainst += m.cupsA;
    A.blowsFor += m.blowsA; A.blowsAgainst += m.blowsB;
    B.blowsFor += m.blowsB; B.blowsAgainst += m.blowsA;
    if(isDraw(m)){ A.draws++; B.draws++; }
    else if(m.cupsA > m.cupsB){ A.wins++; B.losses++; }
    else { B.wins++; A.losses++; }
  });

  rows.forEach(r => {
    r.diff = r.cupsFor - r.cupsAgainst;
    r.points = r.wins * POINTS_WIN + r.draws * POINTS_DRAW;
  });
  rows.sort((x, y) =>
    y.points - x.points || y.diff - x.diff || y.cupsFor - x.cupsFor ||
    x.name.localeCompare(y.name, "sk")
  );
  return rows;
}

function playedMatches(){
  return allMatches().filter(m => m.done);
}

/** Podium for the top three, plus falling confetti. Read-only view of the results. */
function podiumMarkup(ranking, animate){
  if(ranking.length < 3) return "";

  const [first, second, third] = ranking;
  const place = (row, spot, delay) => `
    <div class="place p${spot}" style="--d:${delay}s">
      <div class="plate">
        <span class="pname">${esc(row.name)}</span>
        <span class="pmeta">${row.s.wins}V ${row.s.draws}R ${row.s.losses}P · ${row.s.points} b.</span>
      </div>
      <div class="block"><span class="pnum">${spot}</span></div>
    </div>
  `;

  const confetti = Array.from({ length: 26 }, (_, i) => {
    const x = Math.round((i * 97 + 13) % 100);
    const delay = (1.1 + (i % 7) * 0.16).toFixed(2);
    const rot = 180 + ((i * 53) % 400);
    const fall = 300 + ((i * 37) % 160);
    return `<i style="--cx:${x}%;--cd:${delay}s;--cr:${rot}deg;--cy:${fall}px"></i>`;
  }).join("");

  return `
    <div class="podium-wrap ${animate ? "celebrate" : ""}" id="podium">
      <div class="confetti">${confetti}</div>
      <div class="podium-head">
        <div class="lbl">Víťaz turnaja</div>
        <div class="who">${esc(first.name)}</div>
      </div>
      <div class="podium">
        ${place(second, 2, 0.15)}
        ${place(first, 1, 0.45)}
        ${place(third, 3, 0)}
      </div>
      <div class="podium-actions">
        <button class="btn ghost sm" id="btn-replay">Prehrať animáciu znova</button>
      </div>
    </div>
  `;
}

function wireMatchButtons(root){
  root.querySelectorAll("[data-match]").forEach(btn => {
    if(btn.disabled) return;
    btn.onclick = () => openModal(btn.dataset.match);
  });
}

function openModal(id){
  const m = findMatch(id);
  if(!m || !m.a || !m.b) return;
  openMatchId = id;

  document.getElementById("m-ctx").textContent = matchLabel(m) + " · Stôl " + matchTable(m);
  document.getElementById("m-name-a").textContent = teamName(m.a);
  document.getElementById("m-name-b").textContent = teamName(m.b);
  document.getElementById("m-cups-a").value = m.done ? m.cupsA : "";
  document.getElementById("m-cups-b").value = m.done ? m.cupsB : "";
  document.getElementById("m-blows-a").value = m.blowsA || 0;
  document.getElementById("m-blows-b").value = m.blowsB || 0;
  const msg = document.getElementById("m-msg");
  msg.classList.add("hint");
  msg.textContent = m.stage === "group"
    ? "Remíza je povolená — stačí zadať rovnaký počet pohárov (1 bod pre oboch)."
    : "V pavúku musí byť víťaz — jeden tím musí mať viac pohárov.";
  document.getElementById("m-clear").style.display = m.done ? "" : "none";

  document.getElementById("overlay").classList.add("on");
  setTimeout(() => document.getElementById("m-cups-a").focus(), 40);
}

function closeModal(){
  openMatchId = null;
  document.getElementById("overlay").classList.remove("on");
}

function readNum(id){
  const raw = document.getElementById(id).value.trim();
  if(raw === "") return null;
  const n = Number(raw);
  return Number.isFinite(n) && n >= 0 ? Math.floor(n) : null;
}

function saveModal(){
  const m = findMatch(openMatchId);
  if(!m) return closeModal();

  const cupsA = readNum("m-cups-a");
  const cupsB = readNum("m-cups-b");
  const msg = document.getElementById("m-msg");

  if(cupsA === null || cupsB === null){
    msg.classList.remove("hint");
    msg.textContent = "Vyplň trafené poháre pre oba tímy.";
    return;
  }
  // A knockout match has to produce someone to advance, so no draws there.
  if(cupsA === cupsB && m.stage === "bracket"){
    msg.classList.remove("hint");
    msg.textContent = "V pavúku remíza nie je možná — musí byť jasné, kto postupuje.";
    return;
  }

  m.cupsA = cupsA;
  m.cupsB = cupsB;
  m.blowsA = readNum("m-blows-a") || 0;
  m.blowsB = readNum("m-blows-b") || 0;
  m.done = true;

  if(m.stage === "bracket") propagate();
  save();
  closeModal();
  render();
}

function clearModal(){
  const m = findMatch(openMatchId);
  if(!m) return closeModal();
  clearResult(m);
  if(m.stage === "bracket") propagate();
  save();
  closeModal();
  render();
}

/* =========================================================================
   EXPORT / IMPORT
   ========================================================================= */

function csvCell(value){
  const s = String(value == null ? "" : value);
  return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function csvFrom(rows){
  return rows.map(r => r.map(csvCell).join(";")).join("\r\n");
}

function download(filename, content, mime){
  const blob = new Blob(["﻿" + content], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function stamp(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
    + "_" + p(d.getHours()) + p(d.getMinutes());
}

function exportMatchesCsv(){
  const rows = [[
    "Fáza","Stôl","Tím A","Poháre A","Vyfuknutia A",
    "Tím B","Poháre B","Vyfuknutia B","Víťaz","Odohrané"
  ]];
  allMatches().forEach(m => {
    if(!m.a && !m.b) return;
    rows.push([
      matchLabel(m), matchTable(m),
      teamName(m.a) || "", m.done ? m.cupsA : "", m.done ? m.blowsA : "",
      teamName(m.b) || "", m.done ? m.cupsB : "", m.done ? m.blowsB : "",
      isDraw(m) ? "remíza" : (teamName(winnerOf(m)) || ""),
      m.done ? "áno" : "nie"
    ]);
  });
  download("beerpong-zapasy_" + stamp() + ".csv", csvFrom(rows), "text/csv");
}

function exportStatsCsv(){
  const rows = [[
    "Poradie","Tím","Skupina","Zápasy","Výhry","Remízy","Prehry",
    "Poháre dané","Poháre prijaté","Rozdiel","Vyfuknutia dané","Vyfuknutia prijaté","Body"
  ]];
  overallStats().forEach((r, i) => {
    rows.push([
      i + 1, r.name, r.group || "", r.played, r.wins, r.draws, r.losses,
      r.cupsFor, r.cupsAgainst, r.diff, r.blowsFor, r.blowsAgainst, r.points
    ]);
  });
  download("beerpong-statistiky_" + stamp() + ".csv", csvFrom(rows), "text/csv");
}

/**
 * Whole tournament as plain text — teams, schedule, standings, bracket.
 * Readable as-is, so it can be printed or pasted into a chat.
 */
function buildPlainText(){
  const L = [];
  const pad = (s, n) => String(s).length >= n ? String(s) : String(s) + " ".repeat(n - String(s).length);
  const rule = ch => L.push(ch.repeat(46));
  const d = new Date();
  const p = n => String(n).padStart(2, "0");

  L.push("BEERPONG TURNAJ");
  L.push(p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes()));
  rule("=");
  L.push("");

  L.push("TÍMY (" + state.teams.length + ")");
  if(!state.drawn){
    state.teams.forEach((t, i) => L.push("  " + (i + 1) + ". " + t.name));
  }else{
    ["A", "B"].forEach(g => {
      const list = state.teams.filter(t => t.group === g);
      L.push("  Skupina " + g + " — stôl " + (g === "A" ? 1 : 2) + " (" + list.length + ")");
      list.forEach(t => L.push("    · " + t.name));
    });
  }
  L.push("");

  if(state.drawn){
    ["A", "B"].forEach(g => {
      const matches = state.groupMatches.filter(m => m.group === g);
      if(matches.length === 0) return;
      rule("-");
      L.push("ROZPIS — SKUPINA " + g + " (stôl " + (g === "A" ? 1 : 2) + ")");
      const rounds = {};
      matches.forEach(m => { (rounds[m.round] = rounds[m.round] || []).push(m); });
      Object.keys(rounds).sort((x, y) => x - y).forEach(r => {
        L.push("  " + (Number(r) + 1) + ". kolo");
        rounds[r].forEach(m => {
          const line = "    " + pad(teamName(m.a), 18) + " vs " + pad(teamName(m.b), 18);
          L.push(m.done
            ? line + " " + m.cupsA + ":" + m.cupsB + (isDraw(m) ? " REMÍZA" : "")
              + "  (vyfuk. " + m.blowsA + ":" + m.blowsB + ")"
            : line + " ____");
        });
      });
      L.push("");

      const rows = standings(g);
      L.push("TABUĽKA — SKUPINA " + g + "   (výhra 3 b., remíza 1 b.)");
      L.push("    " + pad("Tím", 18) + pad("Z", 3) + pad("V", 3) + pad("R", 3) + pad("P", 3)
        + pad("Poháre", 10) + pad("+/-", 6) + pad("Vyfuk.", 8) + "B");
      rows.forEach((r, i) => {
        L.push("  " + (i + 1) + "." + " " + pad(r.name, 18) + pad(r.played, 3) + pad(r.wins, 3)
          + pad(r.draws, 3) + pad(r.losses, 3)
          + pad(r.cupsFor + ":" + r.cupsAgainst, 10) + pad((r.diff > 0 ? "+" : "") + r.diff, 6)
          + pad(r.blowsFor, 8) + r.points);
      });
      L.push("");
    });
  }

  if(state.bracket){
    rule("-");
    L.push("PAVÚK — postupujú všetky tímy");
    const total = state.bracket.rounds.length;
    state.bracket.rounds.forEach((rnd, r) => {
      L.push("  " + roundTitle(r, total).toUpperCase());
      rnd.forEach(m => {
        const a = teamName(m.a) || "—";
        const b = teamName(m.b) || "—";
        if(m.bye){ L.push("    " + pad(a, 18) + " voľný žreb → postup"); return; }
        const line = "    " + pad(a, 18) + " vs " + pad(b, 18);
        L.push(m.done
          ? line + " " + m.cupsA + ":" + m.cupsB + "  (vyfuk. " + m.blowsA + ":" + m.blowsB + ")"
          : line + " ____");
      });
    });
    if(state.bracket.third){
      const t = state.bracket.third;
      L.push("  O 3. MIESTO");
      L.push("    " + pad(teamName(t.a) || "—", 18) + " vs " + pad(teamName(t.b) || "—", 18)
        + (t.done ? " " + t.cupsA + ":" + t.cupsB : " ____"));
    }
    L.push("");
    const champ = champion();
    if(champ){
      rule("=");
      L.push("VÍŤAZ TURNAJA: " + teamName(champ).toUpperCase());
      rule("=");
      L.push("");

      const ranking = finalRanking();
      L.push("FINÁLNA TABUĽKA");
      L.push("    " + pad("Tím", 18) + pad("Skončil", 14) + pad("Z", 3) + pad("V", 3)
        + pad("R", 3) + pad("P", 3) + pad("Poháre", 10) + pad("+/-", 6) + "B");
      ranking.forEach(r => {
        L.push(pad("  " + r.rank + ".", 5) + pad(r.name, 18) + pad(r.exitLabel, 14)
          + pad(r.s.played, 3) + pad(r.s.wins, 3) + pad(r.s.draws, 3) + pad(r.s.losses, 3)
          + pad(r.s.cupsFor + ":" + r.s.cupsAgainst, 10)
          + pad((r.s.diff > 0 ? "+" : "") + r.s.diff, 6) + r.s.points);
      });
      L.push("");
    }
  }

  return L.join("\r\n");
}

function exportText(){
  download("beerpong-rozpis_" + stamp() + ".txt", buildPlainText(), "text/plain");
}

function copyText(btn){
  const text = buildPlainText();
  const done = () => {
    const original = btn.textContent;
    btn.textContent = "Skopírované ✓";
    setTimeout(() => { btn.textContent = original; }, 1600);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); done(); }
  catch(e){ alert("Kopírovanie sa nepodarilo — použi Stiahnuť TXT."); }
  document.body.removeChild(ta);
}

function exportJson(){
  const payload = { app:"beerpong-turnaj", version:1, exportedAt:new Date().toISOString(), state };
  download("beerpong-turnaj_" + stamp() + ".json", JSON.stringify(payload, null, 2), "application/json");
}

function triggerImport(){
  document.getElementById("import-file").click();
}

function handleImport(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(String(reader.result));
      const incoming = parsed && parsed.state ? parsed.state : parsed;
      if(!incoming || !Array.isArray(incoming.teams)) throw new Error("bad shape");
      if(!confirm("Načítať turnaj zo súboru? Aktuálny turnaj sa prepíše.")) return;
      state = Object.assign(emptyState(), incoming);
      if(state.bracket) propagate();
      save();
      activeTab = "teams";
      render();
    }catch(e){
      alert("Súbor sa nepodarilo načítať — nevyzerá ako záloha tohto turnaja.");
    }
  };
  reader.readAsText(file);
}

/* =========================================================================
   AKCIE
   ========================================================================= */

function onBuildBracket(){
  const prog = groupProgress();
  if(!prog.complete){
    const left = prog.total - prog.done;
    if(!confirm(`V skupinách ostáva ${left} nedohraných zápasov. Vygenerovať pavúk aj tak? Nasadenie bude podľa priebežnej tabuľky.`)) return;
  }
  if(state.bracket && !confirm("Pavúk už existuje. Pregenerovanie zmaže všetky jeho výsledky. Pokračovať?")) return;

  buildBracket();
  save();
  render();
  setTab("bracket");
}

function onDraw(){
  if(state.drawn && !confirm("Nové losovanie zmaže všetky zápasy aj výsledky. Pokračovať?")) return;
  drawGroups();
  save();
  render();
  setTab("groups");
}

function onReset(){
  if(!confirm("Zmazať celý turnaj a začať odznova?")) return;
  state = emptyState();
  save();
  activeTab = "teams";
  render();
}

/* =========================================================================
   EVENTY
   ========================================================================= */

document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.onclick = () => { if(!btn.disabled) setTab(btn.dataset.tab); };
});

document.getElementById("team-form").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("team-name");
  const name = input.value.trim();
  if(!name) return;
  if(state.teams.some(t => t.name.toLowerCase() === name.toLowerCase())){
    alert("Tím s týmto názvom už existuje.");
    return;
  }
  state.teams.push({ id: uid("t"), name, group: null });
  input.value = "";
  input.focus();
  save();
  render();
});

document.getElementById("team-list").addEventListener("click", e => {
  const btn = e.target.closest("[data-remove]");
  if(!btn) return;
  const id = btn.dataset.remove;
  const t = teamById(id);
  if(state.drawn && !confirm(`Zmazať tím „${t ? t.name : ""}“? Losovanie aj všetky výsledky sa zrušia.`)) return;
  state.teams = state.teams.filter(x => x.id !== id);
  if(state.drawn){
    state.teams.forEach(x => { x.group = null; });
    state.drawn = false;
    state.groupMatches = [];
    state.bracket = null;
    activeTab = "teams";
  }
  save();
  render();
});

document.getElementById("btn-draw").onclick = onDraw;
document.getElementById("btn-reset").onclick = onReset;
document.getElementById("btn-print").onclick = () => window.print();

document.getElementById("m-save").onclick = saveModal;
document.getElementById("m-cancel").onclick = closeModal;
document.getElementById("m-clear").onclick = clearModal;

document.getElementById("overlay").addEventListener("click", e => {
  if(e.target.id === "overlay") closeModal();
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && openMatchId) closeModal();
  if(e.key === "Enter" && openMatchId && e.target.tagName === "INPUT"){
    e.preventDefault();
    saveModal();
  }
});

document.querySelectorAll("[data-step]").forEach(btn => {
  btn.onclick = () => {
    const input = document.getElementById(btn.dataset.target);
    const current = Number(input.value) || 0;
    input.value = Math.max(0, current + Number(btn.dataset.step));
  };
});

document.getElementById("import-file").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if(file) handleImport(file);
  e.target.value = "";
});

render();
showRestoredFlag(!!restoredState && restoredState.teams.length > 0);
</script>
